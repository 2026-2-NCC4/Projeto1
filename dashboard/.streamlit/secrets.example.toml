# Modelo de configuração do envio de e-mail (recuperação de senha).
#
# 1. Copie este arquivo para .streamlit/secrets.toml (mesma pasta).
# 2. Preencha com os dados da conta que vai enviar os e-mails.
# 3. Teste antes de usar no app:   py testar_email.py seu.email@exemplo.com
# 4. Nunca faça commit do secrets.toml: ele já está no .gitignore.
#
# Gmail:
#   - Ative a verificação em duas etapas na conta Google.
#   - Crie uma "senha de app" em https://myaccount.google.com/apppasswords
#   - Use essa senha de 16 letras abaixo (não a senha normal da conta).
#
# Outlook / Hotmail: servidor = "smtp-mail.outlook.com", porta = 587
#   (a conta precisa permitir SMTP autenticado).
#
# Sem esta configuração, a recuperação de senha fica indisponível.

[smtp]
servidor = "smtp.gmail.com"
porta = 587                 # 587 = STARTTLS (Gmail, Outlook); 465 = SSL
usuario = "seu.email@gmail.com"
senha = "sua-senha-de-app"
remetente = "CTI Analytics <seu.email@gmail.com>"
# seguranca = "starttls"    # opcional: "starttls", "ssl" ou "nenhuma" (só servidor local de testes)

# Só para desenvolvimento: sem SMTP configurado, mostra o código na tela.
# Nunca deixe true numa plataforma publicada.
[auth]
modo_teste = false
