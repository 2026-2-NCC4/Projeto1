# Modelo de configuração do envio de e-mail (recuperação de senha).
#
# 1. Copie este arquivo para .streamlit/secrets.toml (mesma pasta).
# 2. Preencha com os dados da conta que vai enviar os e-mails.
# 3. Nunca faça commit do secrets.toml: ele já está no .gitignore.
#
# Com Gmail: ative a verificação em duas etapas e crie uma "senha de app"
# em https://myaccount.google.com/apppasswords. Use essa senha abaixo,
# não a senha normal da conta.
#
# Enquanto o secrets.toml não existir, o código de redefinição aparece
# na própria tela (modo de teste).

[smtp]
servidor = "smtp.gmail.com"
porta = 587
usuario = "seu.email@gmail.com"
senha = "sua-senha-de-app"
remetente = "CTI Analytics <seu.email@gmail.com>"
